<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>
  <g transform="translate(200,200)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e7e9ee" stroke-width="2.5"/>
    <!-- 5-point star core -->
    <polygon points="0,-45 12,-14 45,-14 18,6 28,40 0,20 -28,40 -18,6 -45,-14 -12,-14"
      fill="none" stroke="#2E6BFF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 5"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-family="monospace" font-size="13" fill="#2E6BFF" letter-spacing="2">STAR-GRAIN</text>
  <text x="24" y="368" font-family="monospace" font-size="12" fill="#6b7280" letter-spacing="2">GRAO-ABS // ESTRELA</text>
</svg>
