<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f14"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
  </g>
  <!-- isometric cylinder -->
  <g transform="translate(200,205)">
    <ellipse cx="0" cy="-90" rx="90" ry="30" fill="none" stroke="#e7e9ee" stroke-width="2.5"/>
    <line x1="-90" y1="-90" x2="-90" y2="90" stroke="#e7e9ee" stroke-width="2.5"/>
    <line x1="90" y1="-90" x2="90" y2="90" stroke="#e7e9ee" stroke-width="2.5"/>
    <path d="M -90 90 A 90 30 0 0 0 90 90" fill="none" stroke="#e7e9ee" stroke-width="2.5"/>
    <ellipse cx="0" cy="-90" rx="30" ry="10" fill="#000" stroke="#2E6BFF" stroke-width="2.5"/>
    <!-- CNC lines -->
    <line x1="-90" y1="-40" x2="90" y2="-40" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="-90" y1="10" x2="90" y2="10" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="-90" y1="60" x2="90" y2="60" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 5"/>
  </g>
  <text x="200" y="330" text-anchor="middle" font-family="monospace" font-size="13" fill="#2E6BFF" letter-spacing="2">Ø38mm</text>
  <text x="24" y="368" font-family="monospace" font-size="12" fill="#6b7280" letter-spacing="2">GRAO-PMMA // CNC</text>
</svg>
