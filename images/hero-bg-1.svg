<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky1" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="55%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="flameA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB199"/>
      <stop offset="25%" stop-color="#FF4B12"/>
      <stop offset="100%" stop-color="#FF4B12" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1)"/>
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="1.4" opacity="0.8"/><circle cx="420" cy="80" r="1" opacity="0.6"/>
    <circle cx="740" cy="180" r="1.6" opacity="0.7"/><circle cx="980" cy="60" r="1" opacity="0.5"/>
    <circle cx="1240" cy="140" r="1.3" opacity="0.7"/><circle cx="1500" cy="90" r="1" opacity="0.6"/>
    <circle cx="1700" cy="220" r="1.5" opacity="0.8"/><circle cx="120" cy="320" r="1" opacity="0.5"/>
    <circle cx="560" cy="260" r="1.2" opacity="0.6"/><circle cx="900" cy="300" r="1" opacity="0.5"/>
    <circle cx="1380" cy="330" r="1.4" opacity="0.7"/><circle cx="1820" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="300" cy="450" r="1" opacity="0.4"/><circle cx="1100" cy="420" r="1.1" opacity="0.5"/>
  </g>
  <!-- distant horizon -->
  <rect x="0" y="900" width="1920" height="180" fill="#000000"/>
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#1c2430" stroke-width="1"/>
  <!-- rocket ascending, offset right -->
  <g transform="translate(1360,760) rotate(-4)">
    <path d="M -18 100 L 0 260 L 18 100 Z" fill="url(#flameA)"/>
    <rect x="-30" y="-260" width="60" height="360" rx="10" fill="#05070a" stroke="#e7e9ee" stroke-width="2"/>
    <path d="M -30 60 L 0 -300 L 30 60" fill="none" stroke="#e7e9ee" stroke-width="0" />
    <path d="M -30 -260 L 0 -320 L 30 -260 Z" fill="#05070a" stroke="#e7e9ee" stroke-width="2"/>
    <path d="M -30 60 L -55 100 L -30 100 Z" fill="#05070a" stroke="#e7e9ee" stroke-width="2"/>
    <path d="M 30 60 L 55 100 L 30 100 Z" fill="#05070a" stroke="#e7e9ee" stroke-width="2"/>
    <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#2E6BFF" stroke-width="2"/>
  </g>
  <!-- grid overlay faint -->
  <g opacity="0.04" stroke="#ffffff">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
</svg>
